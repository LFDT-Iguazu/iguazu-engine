version: "2"
run:
  tests: false
linters:
  default: none
  enable:
    - durationcheck
    - goconst
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    goconst:
      min-len: 3
      min-occurrences: 6
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      # Helpers used only by the tests of the same package (excluded in v1
      # with skip-files).
      - token/operation/test_utils.go
      - validator/operation/test_utils.go
      - validator/txlog/test_utils.go
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
